name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
        continue-on-error: true
      - name: Dispatch npm publish
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish-npm.yml -f tag="${RELEASE_TAG}" -f prerelease=false -f update_floating_tags=true
      - name: Explain non-blocking release automation
        run: |
          cat <<'EOF'
          release-please is advisory because repository Actions policy currently blocks GitHub Actions from creating pull requests.
          Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests to make this blocking again.
          EOF
