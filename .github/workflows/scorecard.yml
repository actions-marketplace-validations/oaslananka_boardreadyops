name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCORECARD_CHECKS: Dangerous-Workflow,Dependency-Update-Tool,Fuzzing,License,Pinned-Dependencies,SAST,Security-Policy,Token-Permissions,Vulnerabilities
  SCORECARD_IMAGE: ghcr.io/ossf/scorecard:v5.5.0@sha256:3f24714e9366917adb7a05635382c97dfecb14b21eaef3dfa2ea48c8e23e0795
  SCORECARD_MIN_SCORE: "9.0"

jobs:
  scorecard:
    name: openssf-scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Run enforced Scorecard baseline
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_AUTH_TOKEN \
            "${SCORECARD_IMAGE}" \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --checks="${SCORECARD_CHECKS}" \
            --show-details \
            --format=json > scorecard.json
          node scripts/check-scorecard-baseline.mjs \
            --report scorecard.json \
            --minimum "${SCORECARD_MIN_SCORE}" \
            --checks "${SCORECARD_CHECKS}" \
            --summary

      - name: Upload Scorecard JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scorecard-baseline
          path: scorecard.json
